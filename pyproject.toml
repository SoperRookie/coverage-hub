[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "covhub"
version = "2.0.0"
description = "JaCoCo 运行期覆盖率的采集与看板"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.0",
    "PyMySQL>=1.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "pyflakes"]

[project.scripts]
covhub = "covhub.cli:main"

[tool.setuptools]
packages = ["covhub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
