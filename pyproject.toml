[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "covhub"
version = "2.3.1"
description = "JaCoCo 运行期覆盖率的采集与看板"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.0",
    "PyMySQL>=1.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "pyflakes", "httpx>=0.27"]

[project.scripts]
covhub = "covhub.cli:main"

[tool.setuptools]
packages = ["covhub", "covhub.api", "covhub.db", "covhub.db.migrations", "covhub.db.migrations.versions"]

[tool.setuptools.package-data]
# 只有后端自己的资源（/docs 用的 swagger-ui）。前端产物 2.3 起不随包分发 ——
# 它是独立交付物，在 web/dist，给 nginx 解包或用 serve.webDir 指过去
covhub = ["static/**", "db/migrations/script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
