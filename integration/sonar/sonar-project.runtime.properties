# 运行期覆盖率 project 的扫描配置模板
#
# 与主 project 的区别：
#   - projectKey 加 -runtime 后缀，独立成一个 project
#   - projectVersion 用被测服务的版本号，配合 New Code = Previous version 做版本对比
#   - 只关心覆盖率，代码异味/重复率在主 project 已经分析过，这里不重复
#
# 用法：把下面的占位符替换掉，或用 push-runtime.sh 自动填。

sonar.projectKey=SERVICE-runtime
sonar.projectName=SERVICE (runtime coverage)
sonar.projectVersion=VERSION

# 源码必须 checkout 到 VERSION 对应的版本，否则覆盖标记会打到错误的行上
sonar.sources=SOURCES

# 必须是采集时运行的那份 class —— JaCoCo 按 CRC64 class id 匹配，对不上等于没数据
sonar.java.binaries=BINARIES

# covhub 归档目录里的 jacoco.xml
sonar.coverage.jacoco.xmlReportPaths=XML_REPORT

sonar.sourceEncoding=UTF-8

# 该 project 不做代码质量分析，只看覆盖率。
# 排除测试代码目录，避免把测试类本身算进覆盖率分母。
sonar.test.inclusions=**/src/test/**
sonar.exclusions=**/generated/**,**/target/**
