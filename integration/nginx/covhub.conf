# covhub 前后端分离部署的 nginx 模板。
#
# 前端产物（web/dist）由 nginx 直接发，/api/*、/docs 与报告目录反代给 hub。
# **浏览器看到的仍然是同一个源** —— 这是有意的：控制面的鉴权认 Cookie，开跨域等于
# 让任意页面替已登录的浏览器调写接口，所以 hub 一个 CORS 头都不发。前端换域名的话，
# 要么把 hub 也反代到同一个域名下（就像这里），要么别分开。
#
# 用法：把 web/dist 的内容解包到 root 指的目录，改掉 server_name 和 proxy_pass 的地址。
#
#   scp -r web/dist/* nginx机器:/opt/covhub-web/
#
# 前端产物是纯静态文件，换版本就是覆盖一遍目录，不用重启 hub。

server {
    listen 80;
    server_name covhub.internal;

    root /opt/covhub-web;          # web/dist 解包到这里
    index index.html;

    # 看板走 hash 路由（#/projects/xxx），服务端只会收到 /，所以**不需要** history 回落。
    # 这里故意用 =404 而不是 try_files ... /index.html：未知路径回落 index.html 会让
    # covhub-client.sh、Jenkins 库那些 curl -sSf 拿到 200 的 HTML 而不是失败信号。
    location / {
        try_files $uri $uri/ =404;
    }

    # 带 hash 的文件名，长缓存；index.html 必须不缓存，否则前端换了版本浏览器还拿旧的
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ---- 以下反代给 hub ----

    location /api/ {
        proxy_pass http://127.0.0.1:8900;
        proxy_set_header Host $host;
        # 上传接口（class 产物、单测 XML、diff）走原始正文，默认的 1m 不够
        client_max_body_size 200m;
        # predeploy 要跑 jacococli，几分钟是正常的
        proxy_read_timeout 300s;
    }

    # 接口文档与它的资源（都不要令牌，资源在 Python 包里，不引 CDN）
    location = /docs {
        proxy_pass http://127.0.0.1:8900;
        proxy_set_header Host $host;
    }
    location /swagger/ {
        proxy_pass http://127.0.0.1:8900;
        proxy_set_header Host $host;
    }

    # JaCoCo 报告、jacoco.xml、class 产物、diff —— 都在 hub 的 dataDir 里，**受令牌门禁**。
    # 看板下发的链接就是这种形状（/<服务>/current/html/index.html 之类），所以路径不能改。
    # 别在 nginx 这一层再加一套 basic auth：hub 的 Cookie 流程会被打断。
    location ~ ^/[^/]+/(current|versions|unit|artifacts|diff)/ {
        proxy_pass http://127.0.0.1:8900;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
}

# 想让 hub 自己把看板一起托管（单机、懒得装 nginx）就别用这个文件：
# 把 web/dist 拷到 hub 机器上，配置里写 serve.webDir，然后直接开 hub 的端口。
#
#   serve:
#     port: 8900
#     token: "..."
#     webDir: /opt/covhub/web
